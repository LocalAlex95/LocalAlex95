name: Kartenapp
options:
  bundleIdPrefix: de.localalex95
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kartenapp:
    type: application
    platform: iOS
    sources: [Kartenapp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.localalex95.karten
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meine Karten
        INFOPLIST_KEY_NSCameraUsageDescription: Die Kamera wird benutzt, um den Barcode deiner Karte zu scannen.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  KartenappTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KartenappTests]
    dependencies:
      - target: Kartenapp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Kartenapp:
    build:
      targets:
        Kartenapp: all
        KartenappTests: [test]
    test:
      targets:
        - KartenappTests
