name: Kartenapp bauen

on:
  push:
    paths:
      - "kartenapp/**"
      - ".github/workflows/kartenapp.yml"
  pull_request:
    paths:
      - "kartenapp/**"
      - ".github/workflows/kartenapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kartenapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und Debug-APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kartenapp-debug-apk
          path: kartenapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
